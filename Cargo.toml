[package]
name = "ttype"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Terminal typing practice with code modes, replays, and a WPM chart"
license = "MIT"

[lib]
name = "ttype_core"
path = "src/lib.rs"

[[bin]]
name = "ttype"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.5.53", features = ["derive"] }
clap_complete = "=4.5.48"
clap_mangen = "=0.2.29"
crossterm = "=0.28.1"
dirs = "=5.0.1"
flate2 = "=1.1.10"
rand_chacha = "=0.9.0"
ratatui = "=0.29.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
thiserror = "=2.0.12"
tar = "=0.4.46"
toml = "=0.8.22"
# `toml 0.8.22` accepts 0.22.27, whose serializer regressed under this
# toolchain; pin the compatible patch release selected by its source range.
toml_edit = "=0.22.26"
ureq = "=3.0.9"

[dev-dependencies]
proptest = "=1.6.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
